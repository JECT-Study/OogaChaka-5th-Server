# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# https://docs.coderabbit.ai/reference/configuration
# PR 생성 후 수행하는 2차 자동 리뷰 전용 설정.
language: ko-KR

tone_instructions: >-
  한국어로 리뷰한다. 모든 리뷰 의견은 P1~P5 중 하나와 콜론으로 시작한다.
  문제의 원인, 실제 영향, 개선 방향을 간결하게 설명한다.
  근거 없는 추측과 취향에 따른 강제 수정은 피한다.

reviews:
  profile: chill
  request_changes_workflow: false
  poem: false
  auto_review:
    enabled: true
    drafts: false
    # 공용 개발 브랜치명이 미정이므로 모든 대상 브랜치의 일반 PR을 리뷰한다.
    base_branches:
      - ".*"
  path_instructions:
    - path: "**"
      instructions: |
        PR의 변경 사항과 관련 호출부를 읽고 버그, 성능, 보안, 설계 문제를 검토한다.
        모든 인라인 리뷰 의견은 Pn: 내용 형식으로 시작한다.
        P1: 반드시 수정할 심각한 오류, 보안 문제, 데이터 손실 위험. 해결 전 병합 불가.
        P2: 설계 결함, 성능 등 중요한 개선. 수정하거나 미반영 사유 공유.
        P3: 컨벤션 위반, 가독성 개선. 수정 권장, 선택적 반영.
        P4: 사소한 개선 및 취향에 가까운 제안. 선택적 반영.
        P5: 개인 의견 및 참고 사항. 반영 필수 아님.

        로직: 경계값, null, 빈 결과, 상태 전이, 중복 요청과 동시성 문제를 검토한다.
        성능: 반복 DB 조회, N+1, 과도한 조회량, 외부 호출과 자원 누수를 확인한다.
        보안: 인증 누락, 권한 및 소유권 검증, 입력 처리, 민감정보 노출을 확인한다.
        설계: 책임 분리, 순환 의존성, 트랜잭션 경계, 예외 전파와 API 호환성을 확인한다.
        암호화: 키 노출, IV 재사용, 변조 검증 누락, 실패 시 평문 저장 여부를 확인한다.

        실제 발생 조건, 근거, 영향과 개선 방향을 제시한다.
        변경으로 발생한 문제와 기존 문제를 구분하고 같은 원인의 지적은 묶는다.
        확인하지 못한 동작과 운영 상태는 확인 필요로 남긴다.
        단순 취향은 P4~P5로 분류하고 과도한 구조 변경을 요구하지 않는다.
        문제가 없으면 지적을 만들어내지 않는다.
        AI의 우선순위와 수정 여부는 개발자가 최종 판단하며 팀원 리뷰를 대체하지 않는다.
    - path: "src/main/resources/db/migration/**"
      instructions: |
        SQL 변경의 실행 가능성과 기존 데이터에 대한 영향을 검토한다.
        버전 충돌, 엔티티와 컬럼의 타입 및 제약조건 불일치를 확인한다.
        데이터 삭제, 길이 축소, NOT NULL 추가, 인덱스 생성의 실패 및 잠금 위험을 검토한다.
        기존 마이그레이션의 수정 또는 삭제는 적용 여부와 체크섬 영향을 확인한다.
        적용 기록을 볼 수 없으면 이미 적용되었다고 단정하지 않는다.

# 셀프 리뷰용 문서를 자동으로 리뷰 기준에 포함하지 않는다.
knowledge_base:
  code_guidelines:
    enabled: false
