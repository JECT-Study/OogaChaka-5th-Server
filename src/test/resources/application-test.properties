# 테스트 전용 반복 바이트 더미 키. 실제 환경에서 사용하지 않는다.
# DB 접속 정보는 Testcontainers가 생성한 일회용 MySQL 값으로만 덮어쓴다.
# 테스트는 ENC(...) 값을 쓰지 않으므로 Jasypt 비밀번호도 더미 값으로 충분하다.
jasypt.encryptor.password=TEST_ONLY_DUMMY_JASYPT_PASSWORD
app.crypto.active-version=v1
app.crypto.aes-keys.v1=AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
app.crypto.hmac-social-id-key=AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI=
app.crypto.hmac-device-token-key=AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM=
app.jwt.secret=BAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQ=
app.oauth.providers.google.enabled=false
app.oauth.providers.kakao.enabled=false
app.oauth.providers.naver.enabled=false
app.fcm.enabled=false
