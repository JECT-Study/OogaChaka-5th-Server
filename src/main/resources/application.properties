spring.application.name=oogachaka

# 아직 실제 접속 정보를 넣지 않은 자리표시자다. 공용 DB 값을 ./gradlew jasyptEncrypt로 암호화해 교체한다.
# 로컬에서는 Git에 올라가지 않는 application-local.properties에 내 DB 정보를 평문으로 적어 덮어쓴다.
spring.datasource.url=ENC(REPLACE_WITH_ENCRYPTED_DB_URL)
spring.datasource.username=ENC(REPLACE_WITH_ENCRYPTED_DB_USERNAME)
spring.datasource.password=ENC(REPLACE_WITH_ENCRYPTED_DB_PASSWORD)

# Schema changes are managed by Flyway; Hibernate only validates mappings.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
# The shared DB had tables before Flyway was adopted. On a non-empty DB without history,
# record the baseline as V1 so V1 only runs on empty DBs.
spring.flyway.baseline-on-migrate=true

# Jasypt 비밀번호는 이 파일에 절대 적지 않는다(적으면 시작이 실패한다).
# 로컬: application-local.properties의 jasypt.encryptor.password / 서버·CI: 환경변수 JASYPT_ENCRYPTOR_PASSWORD
jasypt.encryptor.bean=jasyptStringEncryptor
# 데이터 암호화/HMAC 키는 서로 다른 Base64(32바이트) 값이다.
# 서버·CI는 아래 환경변수로, 로컬은 application-local.properties에 같은 프로퍼티 이름으로 직접 적는다.
app.crypto.active-version=${AES_ACTIVE_VERSION:v1}
app.crypto.aes-keys.v1=${AES_ENCRYPTION_KEY:}
app.crypto.hmac-social-id-key=${HMAC_SOCIAL_ID_KEY:}
app.crypto.hmac-device-token-key=${HMAC_DEVICE_TOKEN_KEY:}
# 교체 시 프로필 설정에 app.crypto.aes-keys.v2=${AES_ENCRYPTION_KEY_V2} 등을 추가한다.

# 이하 인증/푸시 설정은 후속 브랜치가 바인딩한다. 관련 의존성은 아직 추가하지 않는다.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.username=${REDIS_USERNAME:}
# 인증이 필요한 Redis 비밀번호는 ENC(...) 값으로 주입한다.
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s

# JWT_SECRET은 Jasypt로 감싸지 않은 독립된 Base64 키 환경변수다.
# 후속 인증 브랜치는 누락/Base64 오류/서명 알고리즘에 필요한 키 길이 부족 시 시작에 실패해야 한다.
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-ttl=30m
app.jwt.refresh-token-ttl=14d
app.jwt.issuer=${JWT_ISSUER:oogachaka}
app.oauth.state-ttl=5m
app.oauth.connect-timeout=3s
app.oauth.read-timeout=5s

# 외부 client-secret은 ENC(...) 대상이다. 사용 제공자는 환경별 enabled=true로 활성화한다.
# redirect-uri는 프런트 콜백 주소이며 각 제공자 콘솔에 동일하게 등록해야 한다.
app.oauth.providers.google.enabled=${GOOGLE_OAUTH_ENABLED:false}
app.oauth.providers.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.providers.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth.providers.google.redirect-uri=${GOOGLE_REDIRECT_URI:}
app.oauth.providers.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
app.oauth.providers.google.token-uri=https://oauth2.googleapis.com/token
app.oauth.providers.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
app.oauth.providers.google.scopes=openid,profile,email
app.oauth.providers.kakao.enabled=${KAKAO_OAUTH_ENABLED:false}
app.oauth.providers.kakao.client-id=${KAKAO_CLIENT_ID:}
app.oauth.providers.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
app.oauth.providers.kakao.redirect-uri=${KAKAO_REDIRECT_URI:}
app.oauth.providers.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
app.oauth.providers.kakao.token-uri=https://kauth.kakao.com/oauth/token
app.oauth.providers.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
app.oauth.providers.kakao.scopes=profile_nickname,profile_image,account_email
app.oauth.providers.naver.enabled=${NAVER_OAUTH_ENABLED:false}
app.oauth.providers.naver.client-id=${NAVER_CLIENT_ID:}
app.oauth.providers.naver.client-secret=${NAVER_CLIENT_SECRET:}
app.oauth.providers.naver.redirect-uri=${NAVER_REDIRECT_URI:}
app.oauth.providers.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
app.oauth.providers.naver.token-uri=https://nid.naver.com/oauth2.0/token
app.oauth.providers.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
app.oauth.providers.naver.scopes=

# Capacitor의 iOS/Android 기본 origin을 고려한다. 운영은 명시적 허용 목록으로 덮어쓴다.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:capacitor://localhost,http://localhost,https://localhost}
app.cors.allow-credentials=true

# 후속 푸시 구성은 enabled=false이면 Firebase 초기화를 생략한다.
# enabled=true: service-account-path(외부 파일) 또는 service-account-json(ENC 가능) 중 하나만 사용한다.
# 둘 다 비어 있으면 Google ADC(GOOGLE_APPLICATION_CREDENTIALS/워크로드 자격증명)를 사용한다.
app.fcm.enabled=${FCM_ENABLED:false}
app.fcm.project-id=${FCM_PROJECT_ID:}
app.fcm.service-account-path=${FCM_SERVICE_ACCOUNT_PATH:}
app.fcm.service-account-json=${FCM_SERVICE_ACCOUNT_JSON:}

# 후속 푸시 실행기는 app.async.push.*를 바인딩하고 종료 시 대기하도록 구성한다.
app.async.push.core-pool-size=2
app.async.push.max-pool-size=4
app.async.push.queue-capacity=100
app.async.push.thread-name-prefix=push-
app.async.push.await-termination=30s
