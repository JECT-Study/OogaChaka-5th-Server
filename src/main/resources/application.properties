# 애플리케이션 식별 이름. 현재 oogachaka이며 Spring Boot 로그 등에 사용한다.
spring.application.name=oogachaka

# DB 접속 정보
spring.datasource.url=ENC(OI6O6zxuHSFWr1vnOlQuogdc++Gad+Pz1htQnFbyS35jDd+SvfJthuN0rncd4ZkcMbLFOs14f52jUw+cLaKar/lPNf87G4jONxhjSOQtjZ0=)
spring.datasource.username=ENC(41UX+ngdlYWbF9W4D66f8YFRsIo+K5b+pZjaBAdcuw3rhrUshFKBVAVBTa48oVrX)
spring.datasource.password=ENC(jxsExa1kc970C1HFznN10fjvtGo4+cPSJm8snz63/YJq2VIIT/0VfGBVvsvcYbWF)

# 스키마 관리: 변경은 Flyway가 수행하고 Hibernate는 엔티티와 DB 구조를 검증한다.
spring.jpa.hibernate.ddl-auto=validate
# Spring의 schema.sql/data.sql 자동 실행 여부. 현재 never로, 해당 스크립트의 자동 초기화를 사용하지 않는다.
spring.sql.init.mode=never
# Flyway 마이그레이션 사용 여부. 현재 true로, 앱 시작 시 적용되지 않은 마이그레이션을 실행한다.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# 마이그레이션 실행 전 이력 검증 여부. 현재 true로, 적용 이력과 파일의 버전·체크섬 등이 맞지 않으면 실패한다.
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=ENC(AP/IS1BdnNLFR5sdcz+iJAqm4IzF5EIlyrWbb2XorLR4tbXJzIWYvg483HLb/7gU)
spring.flyway.password=ENC(+/ypqKKiII5Xgv+Vj/BfKuz58CZywlYuFHEYFKiNo9Oh7ys7b/tPlwK3dtsA584f)

# 설정값 복호화와 데이터 암호화
# ENC(...) 설정값을 복호화할 Spring 빈 이름. 현재 JasyptConfig가 등록한 jasyptStringEncryptor를 사용한다.
jasypt.encryptor.bean=jasyptStringEncryptor

# 새 데이터를 AES로 암호화할 때 사용할 키 버전. 현재 AES_ACTIVE_VERSION을 사용하고, 미지정 시 v1이다.
# 복호화에는 저장된 데이터의 버전에 해당하는 키를 사용하므로 이전 버전 키도 유지해야 한다.
app.crypto.active-version=${AES_ACTIVE_VERSION:v1}
# v1 데이터 암호화·복호화용 AES-256-GCM 키. 현재 AES_ENCRYPTION_KEY를 사용하고, 미지정 시 빈 값이라 시작에 실패한다.
# 교체 시 프로필 설정에 app.crypto.aes-keys.v2=${AES_ENCRYPTION_KEY_V2} 등을 추가한다.
app.crypto.aes-keys.v1=${AES_ENCRYPTION_KEY:}
# 소셜 사용자 ID의 조회·중복 검사에 사용할 HMAC-SHA256 키. 현재 HMAC_SOCIAL_ID_KEY를 사용하며, 미지정 시 시작에 실패한다.
app.crypto.hmac-social-id-key=${HMAC_SOCIAL_ID_KEY:}
# 디바이스 토큰의 조회·중복 검사에 사용할 HMAC-SHA256 키. 현재 HMAC_DEVICE_TOKEN_KEY를 사용하며, 미지정 시 시작에 실패한다.
app.crypto.hmac-device-token-key=${HMAC_DEVICE_TOKEN_KEY:}

# 이하 Redis·JWT·OAuth·CORS·FCM·비동기 푸시는 후속 구현용 설정이다.
# Redis 접속 설정 (후속 인증 기능에서 사용)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.username=${REDIS_USERNAME:}
# 인증이 필요한 환경에서는 ENC(...)로 암호화한 비밀번호를 주입한다.
spring.data.redis.password=${REDIS_PASSWORD:}
# Redis 접속에 TLS를 사용할지 결정한다. 현재 REDIS_SSL_ENABLED를 사용하고, 미지정 시 false로 TLS를 사용하지 않는다.
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s

# JWT 및 OAuth 공통 설정 (후속 인증 구현에서 사용)
# JWT 서명·검증에 사용할 비밀키. 현재 JWT_SECRET을 사용하고, 미지정 시 빈 값이다.
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-ttl=30m
app.jwt.refresh-token-ttl=14d
# JWT 발급자를 식별할 iss 클레임 값. 현재 JWT_ISSUER를 사용하고, 미지정 시 oogachaka다.
app.jwt.issuer=${JWT_ISSUER:oogachaka}
# OAuth 요청·콜백을 연결하고 위조 요청을 방지하는 일회성 state의 Redis 보관 시간. 현재 5m로, 5분이다.
app.oauth.state-ttl=5m
app.oauth.connect-timeout=3s
app.oauth.read-timeout=5s

# 소셜 로그인 제공자별 설정 (후속 인증 구현에서 사용)
# 외부 client-secret은 ENC(...) 대상이다. 사용 제공자는 환경별 enabled=true로 활성화한다.
# redirect-uri는 프런트 콜백 주소이며 각 제공자 콘솔에 동일하게 등록해야 한다.

# Google 로그인 사용 여부. 현재 GOOGLE_OAUTH_ENABLED를 사용하고, 미지정 시 false로 비활성화한다.
app.oauth.providers.google.enabled=${GOOGLE_OAUTH_ENABLED:false}
# Google OAuth 클라이언트 ID. 현재 GOOGLE_CLIENT_ID를 사용하고, 미지정 시 빈 값으로 발급 정보를 별도 입력해야 한다.
app.oauth.providers.google.client-id=${GOOGLE_CLIENT_ID:}
# Google OAuth 클라이언트 비밀값. 현재 GOOGLE_CLIENT_SECRET을 사용하고, 미지정 시 빈 값이다. 제공할 때는 ENC(...)로 암호화한다.
app.oauth.providers.google.client-secret=${GOOGLE_CLIENT_SECRET:}
# Google 인증 후 돌아올 프런트 콜백 URI. 현재 GOOGLE_REDIRECT_URI를 사용하고, 미지정 시 빈 값이다.
app.oauth.providers.google.redirect-uri=${GOOGLE_REDIRECT_URI:}
# 사용자를 Google 로그인·동의 화면으로 보낼 인가 요청 주소. 현재 Google의 OAuth 2.0 인가 엔드포인트로 고정되어 있다.
app.oauth.providers.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
# Google 인가 코드를 토큰으로 교환할 주소. 현재 https://oauth2.googleapis.com/token으로 고정되어 있다.
app.oauth.providers.google.token-uri=https://oauth2.googleapis.com/token
# Google 토큰으로 사용자 정보를 조회할 주소. 현재 OpenID Connect의 v1/userinfo 엔드포인트로 고정되어 있다.
app.oauth.providers.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
# Google에 요청할 권한 목록. 현재 openid(사용자 식별), profile(기본 프로필), email(이메일)을 요청하도록 설정한다.
app.oauth.providers.google.scopes=openid,profile,email

# 카카오 로그인 사용 여부. 현재 KAKAO_OAUTH_ENABLED를 사용하고, 미지정 시 false로 비활성화한다.
app.oauth.providers.kakao.enabled=${KAKAO_OAUTH_ENABLED:false}
# 카카오 OAuth 클라이언트 ID로 사용할 REST API 키. 현재 KAKAO_CLIENT_ID를 사용하고, 미지정 시 빈 값이다.
app.oauth.providers.kakao.client-id=${KAKAO_CLIENT_ID:}
# 카카오 OAuth 클라이언트 비밀값. 현재 KAKAO_CLIENT_SECRET을 사용하고, 미지정 시 빈 값이다. 사용하는 경우 ENC(...)로 암호화한다.
app.oauth.providers.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
# 카카오 인증 후 돌아올 프런트 콜백 URI. 현재 KAKAO_REDIRECT_URI를 사용하고, 미지정 시 빈 값이다.
app.oauth.providers.kakao.redirect-uri=${KAKAO_REDIRECT_URI:}
# 사용자를 카카오 로그인·동의 화면으로 보낼 인가 요청 주소. 현재 https://kauth.kakao.com/oauth/authorize로 고정되어 있다.
app.oauth.providers.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
# 카카오 인가 코드를 토큰으로 교환할 주소. 현재 https://kauth.kakao.com/oauth/token으로 고정되어 있다.
app.oauth.providers.kakao.token-uri=https://kauth.kakao.com/oauth/token
# 카카오 토큰으로 사용자 정보를 조회할 주소. 현재 https://kapi.kakao.com/v2/user/me로 고정되어 있다.
app.oauth.providers.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
# 카카오에 요청할 동의 항목. 현재 닉네임(profile_nickname), 프로필 사진(profile_image), 이메일(account_email)이다.
app.oauth.providers.kakao.scopes=profile_nickname,profile_image,account_email

# 네이버 로그인 사용 여부. 현재 NAVER_OAUTH_ENABLED를 사용하고, 미지정 시 false로 비활성화한다.
app.oauth.providers.naver.enabled=${NAVER_OAUTH_ENABLED:false}
# 네이버 OAuth 클라이언트 ID. 현재 NAVER_CLIENT_ID를 사용하고, 미지정 시 빈 값으로 발급 정보를 별도 입력해야 한다.
app.oauth.providers.naver.client-id=${NAVER_CLIENT_ID:}
# 네이버 OAuth 클라이언트 비밀값. 현재 NAVER_CLIENT_SECRET을 사용하고, 미지정 시 빈 값이다. 제공할 때는 ENC(...)로 암호화한다.
app.oauth.providers.naver.client-secret=${NAVER_CLIENT_SECRET:}
# 네이버 인증 후 돌아올 프런트 콜백 URI. 현재 NAVER_REDIRECT_URI를 사용하고, 미지정 시 빈 값이다.
app.oauth.providers.naver.redirect-uri=${NAVER_REDIRECT_URI:}
# 사용자를 네이버 로그인·동의 화면으로 보낼 인가 요청 주소. 현재 https://nid.naver.com/oauth2.0/authorize로 고정되어 있다.
app.oauth.providers.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
# 네이버 인가 코드를 토큰으로 교환할 주소. 현재 https://nid.naver.com/oauth2.0/token으로 고정되어 있다.
app.oauth.providers.naver.token-uri=https://nid.naver.com/oauth2.0/token
# 네이버 토큰으로 사용자 정보를 조회할 주소. 현재 https://openapi.naver.com/v1/nid/me로 고정되어 있다.
app.oauth.providers.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
# 네이버에 별도로 전달할 scope 목록. 현재 빈 값이며, 동의 항목은 네이버 개발자 콘솔에서 관리하도록 한다.
app.oauth.providers.naver.scopes=

# CORS 설정 (후속 웹 보안 구성에서 사용)
# 브라우저에서 API 호출을 허용할 출처 목록. 현재 CORS_ALLOWED_ORIGINS를 사용하며, 미지정 시 아래 3개 출처를 허용하도록 설정한다.
# 기본값은 Capacitor 앱을 고려한 capacitor://localhost, http://localhost, https://localhost다. 운영에서는 명시적 허용 목록으로 덮어쓴다.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:capacitor://localhost,http://localhost,https://localhost}
# 허용된 출처의 요청에 쿠키 등 인증정보를 포함하도록 허용할지 결정한다. 현재 true로 허용하도록 설정한다.
app.cors.allow-credentials=true

# FCM 푸시 설정 (후속 푸시 구현에서 사용)
# Firebase 초기화 및 푸시 사용 여부. 현재 FCM_ENABLED를 사용하고, 미지정 시 false로 초기화를 생략하도록 설정한다.
app.fcm.enabled=${FCM_ENABLED:false}
# 푸시를 보낼 Firebase 프로젝트 ID. 현재 FCM_PROJECT_ID를 사용하고, 미지정 시 빈 값으로 명시적인 ID를 지정하지 않는다.
app.fcm.project-id=${FCM_PROJECT_ID:}
# enabled=true: service-account-path(외부 파일) 또는 service-account-json(ENC 가능) 중 하나만 사용한다.
# 둘 다 비어 있으면 Google ADC(GOOGLE_APPLICATION_CREDENTIALS/워크로드 자격증명)를 사용한다.
# Firebase 인증용 서비스 계정 JSON 파일의 외부 경로. 현재 FCM_SERVICE_ACCOUNT_PATH를 사용하고, 미지정 시 빈 값이다.
app.fcm.service-account-path=${FCM_SERVICE_ACCOUNT_PATH:}
# Firebase 인증용 서비스 계정 JSON 내용. 현재 FCM_SERVICE_ACCOUNT_JSON을 사용하고, 미지정 시 빈 값이다. ENC(...)로 암호화할 수 있다.
app.fcm.service-account-json=${FCM_SERVICE_ACCOUNT_JSON:}

# 비동기 푸시 실행기 설정 (후속 푸시 구현에서 사용)
# 후속 푸시 실행기는 app.async.push.*를 바인딩하고 종료 시 대기하도록 구성한다.
# 실행기의 기본 작업 스레드 수. 현재 2개로 설정한다.
app.async.push.core-pool-size=2
# 실행기가 늘릴 수 있는 최대 작업 스레드 수. 현재 4개이며, 기본 스레드가 사용 중이고 대기열이 찼을 때 확장하도록 설정한다.
app.async.push.max-pool-size=4
# 실행을 기다릴 푸시 작업의 대기열 크기. 현재 최대 100개 작업을 보관하도록 설정한다.
app.async.push.queue-capacity=100
# 푸시 작업 스레드 이름의 접두어. 현재 push-로 설정하여 로그 등에서 구분하도록 한다.
app.async.push.thread-name-prefix=push-
# 앱 종료 시 진행 중인 푸시 작업이 끝나기를 기다릴 최대 시간. 현재 30s로, 30초다.
app.async.push.await-termination=30s
