app.oauth.providers.kakao.client-secret=ENC(QcuTOgn0TNSNPmFHI6xpFrKB+V8FNCQLSNGnR7o0IPTWPuor2f761bnsgHbH4v88VT7SuU+cZj8gs8OwS74kbQxJUrNY0MbXE6sgR1pRarg=)
