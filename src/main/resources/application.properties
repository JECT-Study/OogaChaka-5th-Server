# 브라우저에서 API 호출을 허용할 출처 목록. 기본값은 로컬 프런트(5173)·Capacitor 앱용이며 운영에서는 CORS_ALLOWED_ORIGINS로 덮어쓴다.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,capacitor://localhost,http://localhost,https://localhost}
