# 애플리케이션 식별 이름. 현재 oogachaka이며 Spring Boot 로그 등에 사용한다.
spring.application.name=oogachaka

# DB 접속 정보
spring.datasource.url=ENC(OI6O6zxuHSFWr1vnOlQuogdc++Gad+Pz1htQnFbyS35jDd+SvfJthuN0rncd4ZkcMbLFOs14f52jUw+cLaKar/lPNf87G4jONxhjSOQtjZ0=)
spring.datasource.username=ENC(41UX+ngdlYWbF9W4D66f8YFRsIo+K5b+pZjaBAdcuw3rhrUshFKBVAVBTa48oVrX)
spring.datasource.password=ENC(jxsExa1kc970C1HFznN10fjvtGo4+cPSJm8snz63/YJq2VIIT/0VfGBVvsvcYbWF)

# 스키마 관리: 변경은 Flyway가 수행하고 Hibernate는 엔티티와 DB 구조를 검증한다.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=ENC(AP/IS1BdnNLFR5sdcz+iJAqm4IzF5EIlyrWbb2XorLR4tbXJzIWYvg483HLb/7gU)
spring.flyway.password=ENC(+/ypqKKiII5Xgv+Vj/BfKuz58CZywlYuFHEYFKiNo9Oh7ys7b/tPlwK3dtsA584f)

# 설정값 복호화와 데이터 암호화
# ENC(...) 설정값을 복호화할 Spring 빈 이름. 현재 JasyptConfig가 등록한 jasyptStringEncryptor를 사용한다.
jasypt.encryptor.bean=jasyptStringEncryptor

# 새 데이터를 AES로 암호화할 때 사용할 키 버전. 현재 AES_ACTIVE_VERSION을 사용하고, 미지정 시 v1이다.
app.crypto.active-version=${AES_ACTIVE_VERSION:v1}
app.crypto.aes-keys.v1=${AES_ENCRYPTION_KEY:}
app.crypto.hmac-social-id-key=${HMAC_SOCIAL_ID_KEY:}
app.crypto.hmac-device-token-key=${HMAC_DEVICE_TOKEN_KEY:}

# Redis: 로그인 state와 refresh를 저장한다. Redis가 없으면 로그인·갱신·로그아웃이 실패한다.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s

# JWT 서명 키(Base64, 32바이트 이상). 비어 있으면 시작에 실패한다.
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-ttl=30m
app.jwt.refresh-token-ttl=14d

app.oauth.state-ttl=5m
app.oauth.connect-timeout=3s
app.oauth.read-timeout=5s

# 소셜 로그인 제공자별 설정
# client-id가 비어 있는 제공자는 사용하지 않는다. client-secret은 ENC(...)로 암호화한다.
# redirect-uri는 프런트 콜백 주소이며 각 제공자 콘솔에 동일하게 등록해야 한다.

# Google
app.oauth.providers.google.client-id=183978888226-d5qgc4ka4kjkt9brppvv5fs89adih0l9.apps.googleusercontent.com
app.oauth.providers.google.client-secret=ENC(nPLGpjdk+RBBF9AdNY8spvm0Mewx+5IZlipOrPlJDvyTpIcVAO8+Tny7sVI4MvwigRfrmzrh8c6/0gSh/c8o1GEZzGPU5h5UIT4GBUJ0ns0=)
app.oauth.providers.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:5173/auth/callback/google}
app.oauth.providers.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
app.oauth.providers.google.token-uri=https://oauth2.googleapis.com/token
app.oauth.providers.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
app.oauth.providers.google.scopes=openid,profile,email

