# local에서만 기본값과 개인 파일을 읽는다. dev/prod는 이 파일을 활성화하지 않는다.
spring.config.activate.on-profile=local
spring.config.import=optional:${app.local-config:file:./src/main/resources/application-local.properties}
# 내 맥에서 직접 실행하는 앱의 기본값. 개인 application-local.properties가 우선한다.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/oogachaka
spring.datasource.username=app
spring.datasource.password=app
spring.flyway.user=migrator
spring.flyway.password=migrator
spring.flyway.baseline-on-migrate=false
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
