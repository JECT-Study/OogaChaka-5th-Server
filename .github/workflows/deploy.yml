name: Deploy app (Spring Boot)

on:
  push:
    branches: [dev]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".coderabbit.yaml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-app
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  TARGET_NAME_TAG: ooga_chaka_app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # (임시) OIDC 로그인 실패 원인 확인용 - 해결되면 이 단계는 삭제
      - name: Debug OIDC claims
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN }}
        run: |
          echo "role=[${ROLE}]"
          TOKEN=$(curl -sH "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c '
          import sys, json, base64
          p = sys.argv[1].split(".")[1]
          p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          for k in ("sub", "aud", "repository", "ref", "event_name", "job_workflow_ref"):
              print(k, "=", c.get(k))
          ' "${TOKEN}"
          
      # 저장소 Settings > Secrets and variables > Actions > Variables 에 AWS_ROLE_ARN 등록
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

 