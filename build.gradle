plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ject'
version = '0.0.1-SNAPSHOT'
description = 'oogachaka'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // [검토] state 일회성 소비와 토큰 교체·폐기에 쓰는 Spring Redis·Lettuce 구현을 사용한다. 실제 Redis 서버는 의존성 설치로 자동 준비되지 않는다.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // [검토] 요청 DTO의 @Valid·@NotBlank·@Pattern 등 입력 검증을 MVC에서 실행하기 위한 구현 의존성이다.
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:4.0.4'
    // Swagger UI(/swagger-ui/index.html)와 OpenAPI 문서(/v3/api-docs)를 생성한다. 3.2.0은 Spring Boot 4.1.2 기준으로 빌드됐다.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    // [검토] 직접 JWT 포맷·서명 파서를 작성하지 않고 JJWT의 공개 생성·검증 API를 사용한다. 버전은 이 브랜치에서 선택한 고정값이다.
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    // [검토] JJWT API가 실행 시 사용할 실제 구현이다. 구현 클래스에 직접 의존하지 않도록 runtimeOnly로 둔다.
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    // jjwt의 JSON 처리는 Gson으로 격리하고 HTTP API는 Boot의 Jackson 3를 사용한다.
    // [검토] JWT 내부 JSON은 Gson 모듈로 처리해 HTTP API의 Jackson 3와 분리한 선택이다. 프로젝트 HTTP 응답을 Gson으로 바꾸지 않는다.
    runtimeOnly 'io.jsonwebtoken:jjwt-gson:0.13.0'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // [검토] 실제 MVC 경로·JSON 계약을 확인하는 @WebMvcTest에 필요한 Boot 4 테스트 모듈이다.
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // [검토] MVC 슬라이스에 실제 Security 자동 설정과 필터 체인을 연결한다. 이를 빼면 현재 테스트는 HttpSecurity 빈이 없어 시작하지 못한다.
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// [검토] 현재 유지하는 단위·MVC 테스트를 외부 서버 없이 실행한다.
tasks.named('test') {
    // [검토] JUnit Jupiter 테스트와 매개변수 반복 실행을 JUnit Platform으로 발견·실행한다.
    useJUnitPlatform()
}

// 기본 입력은 stdin이다. -Pvalue도 지원하지만 비밀값은 셸 이력에 남기지 않는다.
tasks.register('jasyptEncrypt', JavaExec) {
    group = 'application'
    description = 'Jasypt 비밀번호(환경변수 또는 application-local.properties)로 stdin 또는 -Pvalue 값을 암호화한다.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ject.oogachaka.global.config.JasyptEncryptCommand'
    systemProperty 'jasypt.localConfig', file('src/main/resources/application-local.properties').absolutePath
    standardInput = System.in
    doFirst {
        if (project.hasProperty('value')) {
            standardInput = new ByteArrayInputStream(project.property('value').toString().getBytes('UTF-8'))
        }
    }
}
