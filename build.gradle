plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ject'
version = '0.0.1-SNAPSHOT'
description = 'oogachaka'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:4.0.4'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-gson:0.13.0'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 기본 입력은 stdin이다. -Pvalue도 지원하지만 비밀값은 셸 이력에 남기지 않는다.
tasks.register('jasyptEncrypt', JavaExec) {
    group = 'application'
    description = 'Jasypt 비밀번호(환경변수 또는 application-local.properties)로 stdin 또는 -Pvalue 값을 암호화한다.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ject.oogachaka.global.config.JasyptEncryptCommand'
    systemProperty 'jasypt.localConfig', file('src/main/resources/application-local.properties').absolutePath
    standardInput = System.in
    doFirst {
        if (project.hasProperty('value')) {
            standardInput = new ByteArrayInputStream(project.property('value').toString().getBytes('UTF-8'))
        }
    }
}

tasks.named('processResources') {
    exclude 'application-local.properties'
}