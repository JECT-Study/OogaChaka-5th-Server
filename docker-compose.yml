services:
  app:
    image: ${APP_IMAGE:-oogachaka-app:local}
    container_name: oogachaka-app
    restart: unless-stopped

    ports:
      - "8080:8080"

    env_file:
      - .env.runtime

    environment:
      SERVER_PORT: "8080"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"